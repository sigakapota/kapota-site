name: Atualizar sitemap

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Commitar se mudou
        run: |
          if git diff --quiet sitemap.xml; then
            echo "sitemap.xml já estava atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Atualiza sitemap.xml automaticamente"
          git push
