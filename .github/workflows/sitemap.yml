name: Atualizar site (sitemap + listagens)

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar sitemap.xml, blog/index.html e index.html
        run: node scripts/generate-site.mjs

      - name: Commitar se mudou
        run: |
          if git diff --quiet sitemap.xml blog/index.html index.html; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml blog/index.html index.html
          git commit -m "Atualiza sitemap, listagem do blog e destaques da home automaticamente"
          git push
